<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управління відео</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список видео</h1>
        <p class="subtitle">Всі доступні видео на платформі</p>

        <div id="message" class="message"></div>

        <div class="table-container">
            <table id="videos-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Назва видео</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="2" class="empty-state">Завантаження даних...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <p>Всього видео: <span id="totalCount">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
